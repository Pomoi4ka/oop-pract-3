plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'de.siegmar:fastcsv:4.4.1'
}

application {
    mainClass = 'impl.Main'
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

def texFile    = file('report.tex')
def dotDir     = file('src/assets/dot')
def reportDir  = layout.buildDirectory.dir('report')
def workDir    = projectDir

tasks.register('renderDiagrams') {
    def outDir = layout.buildDirectory.dir('report/assets')

    inputs.dir(dotDir)
    outputs.dir(outDir)

    doLast {
        def dir = outDir.get().asFile
        dir.mkdirs()
        dotDir.eachFileMatch(~/.*\.dot/) { f ->
            def target = new File(dir, f.name.replace('.dot', '.png'))
            def proc = new ProcessBuilder(
                'dot', '-Tpng', '-o', target.absolutePath, f.absolutePath
            ).redirectErrorStream(true).start()
            def out = proc.inputStream.text
            if (proc.waitFor() != 0) {
                throw new GradleException("dot failed on ${f.name}:\n$out")
            }
        }
    }
}

tasks.register('buildReport') {
    dependsOn 'renderDiagrams'

    def tex = file('report.tex')
    def outDir = layout.buildDirectory.dir('report')

    inputs.file(tex)
    inputs.dir(file('src/main/java'))
    inputs.dir(layout.buildDirectory.dir('report/assets'))
    outputs.file(outDir.map { it.file('report.pdf') })

    doLast {
        def dir = outDir.get().asFile
        dir.mkdirs()
        ['-interaction=nonstopmode', '-halt-on-error',
         '-output-directory', dir.absolutePath, tex.absolutePath].with { args ->
            // два прохода для \ref
            2.times {
                def proc = new ProcessBuilder(['pdflatex'] + args)
                    .directory(workDir)
                    .redirectErrorStream(true).start()
                def out = proc.inputStream.text
                if (proc.waitFor() != 0) {
                    throw new GradleException("pdflatex failed:\n$out")
                }
            }
        }
    }
}
