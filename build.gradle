plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'de.siegmar:fastcsv:4.4.1'
}

application {
    mainClass = 'impl.Main'
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
